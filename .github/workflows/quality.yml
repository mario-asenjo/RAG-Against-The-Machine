name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install Python
        run: uv python install 3.10
      - name: Sync dependencies
        run: uv sync --dev
      - name: Context integrity
        run: uv run python scripts/validate-context.py
      - name: Flake8 + mypy
        run: make lint
      - name: Tests
        run: make test
