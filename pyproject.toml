[project]
name = "rag-against-the-machine"
version = "0.0.0"
description = "Incremental implementation of the 42 RAG Against the Machine project"
requires-python = ">=3.10"
dependencies = [
  "fire>=0.7,<1",
  "pydantic>=2.10,<3",
  "tqdm>=4.67,<5",
]

[dependency-groups]
dev = [
  "flake8>=7.1,<8",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
